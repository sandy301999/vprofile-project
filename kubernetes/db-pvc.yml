
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc-claim
  labels:
    app: vprodb
spec:
  accessModes:
    - ReadWriteOnce  # Pod can read & write, but only one pod at a time
  resources:
    requests:
      storage: 1Gi
  storageClassName: default  # Uses the default StorageClass
